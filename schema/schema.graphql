type Item {
  id: ID!
  name: String!
  description: String
  createdAt: String!
  updatedAt: String
}

type Query {
  getItems: [Item]
  getItemById(id: ID!): Item
}

type Mutation {
  createItem(name: String!, description: String): Item
  updateItem(id: ID!, name: String, description: String): Item
  deleteItem(id: ID!): Item
}

schema {
  query: Query
  mutation: Mutation
}
